name: Sync Sports Events

on:
  schedule:
    # প্রতি ৩০ মিনিটে (free API limit মেনে)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-sports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SYNC_SECRET" ]; then
            echo "::error::SUPABASE_URL ও SYNC_SECRET Secret যোগ করুন"
            exit 1
          fi
          curl -sS -f -X POST "$SUPABASE_URL/functions/v1/sync-sports" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-sync-secret: $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
