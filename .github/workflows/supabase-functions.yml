name: Supabase Functions Deploy

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ও SUPABASE_PROJECT_REF Secret যোগ করুন"
            exit 1
          fi

      - name: Set sync secret
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -n "$SYNC_SECRET" ]; then
            npx --yes supabase@2 secrets set "SYNC_SECRET=$SYNC_SECRET" --project-ref "$PROJECT_REF"
          else
            echo "SYNC_SECRET নেই, cron sync কাজ করবে না (admin 'Sync now' চলবে)"
          fi

      - name: Deploy sync-sports function
        run: npx --yes supabase@2 functions deploy sync-sports --project-ref "$PROJECT_REF"
